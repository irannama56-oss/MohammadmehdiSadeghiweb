<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Outer Icon Shadow (Apple iOS Floating Effect) -->
    <filter id="appleShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- 3D Element Shadow (Casts onto icon plate) -->
    <filter id="element3dShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Deep iOS Plate Gradient -->
    <linearGradient id="iosPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2742"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Apple Top Rim Bevel (Specular Highlight) -->
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="25%" stop-color="#94A3B8" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Apple Diagonal Glass Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Center Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Teal Bracket 3D Gradient (Left) -->
    <linearGradient id="teal3dFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="45%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Teal 3D Extrusion Depth -->
    <linearGradient id="teal3dDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <!-- Metallic Platinum M Gradient (Center) -->
    <linearGradient id="mPlatinum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- M 3D Extrusion Depth -->
    <linearGradient id="mDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Orange/Amber Bracket 3D Gradient (Right) -->
    <linearGradient id="orange3dFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Orange 3D Extrusion Depth -->
    <linearGradient id="orange3dDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Ambient Teal Reflection Glow (Left) -->
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Amber Reflection Glow (Right) -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip Path for the Apple Squircle -->
    <clipPath id="squircleClip">
      <rect x="36" y="32" width="440" height="440" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <!-- ================= 1. BASE FLOATING SQUIRCLE ================= -->
  <rect x="36" y="32" width="440" height="440" rx="104" ry="104"
        fill="url(#iosPlate)" filter="url(#appleShadow)"/>

  <!-- ================= 2. INTERNAL LIGHTING & GLASS ================= -->
  <g clip-path="url(#squircleClip)">
    <!-- Subtle Neon Core Glow -->
    <circle cx="256" cy="256" r="180" fill="url(#coreGlow)"/>

    <!-- Left Teal Reflection Glow -->
    <circle cx="120" cy="256" r="140" fill="url(#tealGlow)"/>

    <!-- Right Amber Reflection Glow -->
    <circle cx="390" cy="256" r="140" fill="url(#amberGlow)"/>

    <!-- Apple Top-Left Curved Glass Sheen -->
    <path d="M 36 32 L 476 32 L 476 180 C 340 230 180 230 36 140 Z" fill="url(#glassSheen)"/>
    
    <!-- Top Edge Rim Highlight Line -->
    <line x1="120" y1="33" x2="392" y2="33" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= 3. 3D EMBOSSED GLYPHS ================= -->

  <!-- A. LEFT BRACKET TEAL 3D -->
  <!-- 3D Shadow + Extrusion Base -->
  <path d="M 148 188 L 86 264 L 148 340"
        fill="none" stroke="url(#teal3dDepth)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#element3dShadow)"/>
  <!-- 3D Front Face -->
  <path d="M 148 180 L 86 256 L 148 332"
        fill="none" stroke="url(#teal3dFront)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Specular Top Rim on Left Bracket -->
  <path d="M 148 180 L 86 256"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10"
        stroke-linecap="round"/>

  <!-- B. CENTER MONOGRAM M PLATINUM 3D -->
  <!-- 3D Shadow + Extrusion Base -->
  <path d="M 188 340 L 188 188 L 256 276 L 324 188 L 324 340"
        fill="none" stroke="url(#mDepth)" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#element3dShadow)"/>
  <!-- 3D Front Face -->
  <path d="M 188 332 L 188 180 L 256 268 L 324 180 L 324 332"
        fill="none" stroke="url(#mPlatinum)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Peak Highlight on M -->
  <path d="M 188 180 L 256 268 L 324 180"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- C. RIGHT BRACKET AMBER 3D -->
  <!-- 3D Shadow + Extrusion Base -->
  <path d="M 364 188 L 426 264 L 364 340"
        fill="none" stroke="url(#orange3dDepth)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#element3dShadow)"/>
  <!-- 3D Front Face -->
  <path d="M 364 180 L 426 256 L 364 332"
        fill="none" stroke="url(#orange3dFront)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Specular Top Rim on Right Bracket -->
  <path d="M 364 180 L 426 256"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10"
        stroke-linecap="round"/>

  <!-- ================= 4. SQUIRCLE BORDER BEVEL ================= -->
  <!-- 3D Chamfered Glass Border -->
  <rect x="36" y="32" width="440" height="440" rx="104" ry="104"
        fill="none" stroke="url(#rimLight)" stroke-width="3.5"
        pointer-events="none"/>
</svg>